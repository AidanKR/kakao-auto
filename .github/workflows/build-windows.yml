name: Build Windows Installer

# Builds KakaoAuto.exe (PyInstaller) and KakaoAuto-Setup.exe (Inno Setup)
# on a Windows runner — no local Windows machine needed.
#  - Run manually:  Actions tab -> "Build Windows Installer" -> Run workflow
#  - On a version tag (v1.2.3): also attaches the installer to the GitHub Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build KakaoAuto.exe (PyInstaller)
        shell: pwsh
        run: |
          # kakao.py loads sibling modules dynamically (importlib), which
          # PyInstaller's static analysis can't see. Add every project .py
          # (except the entry point) as an explicit hidden-import so they are
          # bundled into the onefile exe.
          $mods = Get-ChildItem -Filter *.py |
            Where-Object { $_.BaseName -ne 'kakao' } |
            ForEach-Object { '--hidden-import'; $_.BaseName }
          Write-Host "Bundling project modules:" ($mods -join ' ')
          pyinstaller --onefile --name KakaoAuto `
            --collect-submodules uiautomation `
            --collect-submodules comtypes `
            --hidden-import win32gui --hidden-import win32con `
            --hidden-import win32api --hidden-import win32process `
            --hidden-import openpyxl --hidden-import cryptography `
            @mods `
            kakao.py

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = "$env:GITHUB_REF_NAME".TrimStart("v")
          } else {
            $v = "0.0.0-dev"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} installer.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KakaoAuto-Windows
          path: |
            dist/KakaoAuto.exe
            installer_out/KakaoAuto-Setup.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/KakaoAuto.exe
            installer_out/KakaoAuto-Setup.exe
          fail_on_unmatched_files: true
